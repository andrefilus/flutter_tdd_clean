name: app
description: Enquetes para programadores.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=2.7.0 <3.0.0"
  # sdk: ">=2.16.1 <3.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.3
  # cupertino_icons: ^0.1.3
  http: 0.13.3
  # http: 0.12.2
  provider: 6.0.1
  # provider: 4.3.2+3
  equatable: 2.0.3
  # equatable: 1.2.5
  get: 4.3.8
  # get: 3.4.2
  flutter_secure_storage: 4.2.1
  # flutter_secure_storage: 3.3.5
  localstorage: 4.0.0+1
  # localstorage: 3.0.6+9
  carousel_slider: 4.0.0
  # carousel_slider: 2.3.1
  intl: 0.17.0
  # intl: 0.16.1
  kotlin_flavor: ^0.2.0

dependency_overrides:
  test_api: ^0.4.17

dev_dependencies:
  flutter_test:
    sdk: flutter
  # flutter_lints: ^1.0.0
  flutter_launcher_icons: ^0.10.0
  # flutter_launcher_icons: 0.9.2
  # flutter_launcher_icons: 0.8.1
  test: 1.22.2
  # test: 1.15.0
  mockito: 5.3.2
  # mockito: 3.0.2
  mocktail: 0.3.0
  faker: 2.0.0
  # faker: 1.3.0
  network_image_mock: 2.0.1
  # image_test_utils: 1.0.0

flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true
  assets:
    - lib/ui/assets/

flutter_icons:
  ios: true
  android: true
  image_path_android: lib/ui/assets/icon/android.png
  image_path_ios: lib/ui/assets/icon/ios.png
  adaptive_icon_background: lib/ui/assets/icon/background.png
  adaptive_icon_foreground: lib/ui/assets/icon/foreground.png

